name: vibe_music
description: A high-fidelity, super aesthetic Android music player.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animations
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  lucide_icons: ^0.2.0
  flutter_svg: ^2.0.9

  # Navigation
  go_router: ^12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
